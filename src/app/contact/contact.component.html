<section class="contact py-5 mt-5" style="padding-top: 100px; min-height: 95vh; background: linear-gradient(to right, #141e30, #243b55); color: #fff;">
  <div class="container">
    <h2 class="fw-bold text-center mb-4">Contact Me</h2>
    <p class="text-center mb-5 fs-5">
      I’d love to hear from you! Whether you have a project in mind, a question, or just want to connect, feel free to reach out.
    </p>

    <div class="row">
      <div class="col-lg-4 mb-4">
        <div class="p-4 h-100 bg-dark text-white rounded shadow">
          <h5 class="fw-bold mb-4 fs-4">Get in Touch</h5>
          <ul class="list-unstyled fs-5">
            <li class="mb-4">
              <i class="bi bi-envelope-fill me-2 text-info fs-4"></i>
              <span>raynold&#64;gmail.com</span>
            </li>
            <li class="mb-4">
              <i class="bi bi-telephone-fill me-2 text-info fs-4"></i>
              <span>+63 902 025 6789</span>
            </li>
            <li>
              <i class="bi bi-geo-alt-fill me-2 text-info fs-4"></i>
              <span>Baguio City, Philippines</span>
            </li>
          </ul>
        </div>
      </div>

      <div class="col-lg-8">
        <form class="contact-form p-4 shadow-lg rounded bg-white text-dark">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" placeholder="Write your message" required></textarea>
          </div>
          <button type="submit" class="btn btn-info w-100 fw-bold">Send Message</button>
        </form>
      </div>
    </div>

    <div class="social-links text-center mt-5">
      <h5 class="fw-bold mb-3 fs-4">Follow Me</h5>
      <a href="https://facebook.com/" target="_blank" class="mx-3 text-white fs-2"><i class="bi bi-facebook"></i></a>
      <a href="https://linkedin.com/" target="_blank" class="mx-3 text-white fs-2"><i class="bi bi-linkedin"></i></a>
      <a href="https://github.com/" target="_blank" class="mx-3 text-white fs-2"><i class="bi bi-github"></i></a>
    </div>
  </div>
</section>
